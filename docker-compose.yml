# Full stack for stages 0-1.
#
#   make up            build + start everything
#   make demo-stage-1  place 20 orders and watch them flow
#   open http://localhost:5173    dashboard
#   open http://localhost:15672   RabbitMQ management (guest/guest)
#
# Build context is the repo root (.) for the Python services so their Dockerfile
# can copy both libs/pyevents and the service's own directory.

services:
  # ---- infrastructure ------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI + HTTP API
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: postgres-db
    # No host port by default — services reach it on the internal network as
    # `postgres:5432`. To run psql from your host, uncomment and pick a free port:
    #   ports: ["5432:5432"]
    # then: psql postgresql://demo:demo@localhost:5432/<service>_db
    # (or just: docker compose exec postgres psql -U demo -d <service>_db)
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- one-shot: declare exchanges/queues/bindings, then exit -------------
  topology:
    build:
      context: .
      dockerfile: infra/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
    restart: "no"

  # ---- services ----------------------------------------------------------
  # Each Python consumer service gets its own database (see infra/postgres/init.sql).
  order-service:
    build:
      context: .
      dockerfile: services/Dockerfile.python
      args:
        SERVICE: order-service
    ports:
      - "8000:8000"
    depends_on:
      topology:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DB_URL: postgresql://demo:demo@postgres:5432/order_db

  payment-service:
    build:
      context: .
      dockerfile: services/Dockerfile.python
      args:
        SERVICE: payment-service
    depends_on:
      topology:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DB_URL: postgresql://demo:demo@postgres:5432/payment_db
      FAIL_PAYMENTS: "false" # stage 2 flips this
    # Competing consumers: 3 replicas, all reading payment.q AND the same payment_db.
    deploy:
      replicas: 3

  inventory-service:
    build:
      context: .
      dockerfile: services/Dockerfile.python
      args:
        SERVICE: inventory-service
    depends_on:
      topology:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DB_URL: postgresql://demo:demo@postgres:5432/inventory_db
      SLOW_MS: "0" # stage 2 raises this

  shipping-service:
    build:
      context: .
      dockerfile: services/Dockerfile.python
      args:
        SERVICE: shipping-service
    depends_on:
      topology:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DB_URL: postgresql://demo:demo@postgres:5432/shipping_db
      FAIL_SHIPPING: "false" # stages 2 & 5 flip this

  # Stage 5: owns each order's saga (state machine) — sends commands, waits for
  # replies, runs compensation in reverse on failure, times out silent steps.
  orchestrator:
    build:
      context: .
      dockerfile: services/Dockerfile.python
      args:
        SERVICE: orchestrator
    depends_on:
      topology:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DB_URL: postgresql://demo:demo@postgres:5432/orchestrator_db
      # Generous on purpose: a step only "times out" when a service is genuinely
      # silent, not merely slow under load. Too tight and a duplicate storm makes
      # the watchdog compensate orders that were about to succeed — a real lesson
      # in timeout tuning, but not what this stage is demonstrating.
      STEP_TIMEOUT_S: "30"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      topology:
        condition: service_completed_successfully
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672

  observer:
    build:
      context: .
      dockerfile: services/Dockerfile.python
      args:
        SERVICE: observer
    ports:
      - "8001:8001"
    depends_on:
      topology:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      # observer reads every service's DB (read-only) for the consistency panel
      PG_HOST: postgres
      COMPOSE_PROJECT_NAME: event_driven_demo
    volumes:
      # lets the dashboard's "kill <service>" buttons SIGKILL + restart containers
      # (only the four business services are targetable — see app/api.py)
      - /var/run/docker.sock:/var/run/docker.sock

  dashboard:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
    environment:
      # inside compose the proxy targets are service names, not localhost
      VITE_PROXY_OBSERVER: http://observer:8001
      VITE_PROXY_ORDERS: http://order-service:8000
