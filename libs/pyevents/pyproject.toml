[project]
name = "pyevents"
version = "0.1.0"
description = "Shared RabbitMQ transport layer for the event-driven demo"
requires-python = ">=3.11"
dependencies = ["pika>=1.3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyevents"]
